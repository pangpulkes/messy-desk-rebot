<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arm Control</title>
<style>
  :root {
    --bg: #faf9f5; --panel: #ffffff; --ink: #1f1e1d; --muted: #75716b; --line: #e6e2d8;
    --soft: #f0eee6; --accent: #c96442; --accent-ink: #ffffff; --ok: #3f7d4f; --bad: #b3261e;
    --stop: #c62828; --shadow: 0 1px 2px rgba(0,0,0,.04), 0 6px 24px rgba(0,0,0,.06);
    --serif: "Tiempos Headline", "Iowan Old Style", "Palatino", Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #262624; --panel: #30302e; --ink: #f2f0ea; --muted: #a39f97; --line: #3d3d3a;
      --soft: #383835; --shadow: 0 1px 2px rgba(0,0,0,.2), 0 6px 24px rgba(0,0,0,.25);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--sans); }
  body { display: flex; flex-direction: column; }

  header { display: flex; align-items: center; gap: 10px; padding: 12px 18px; }
  .brand { font-family: var(--serif); font-size: 17px; letter-spacing: .2px; }
  .pill { font-size: 12px; padding: 4px 10px; border-radius: 999px; background: var(--soft); color: var(--muted); }
  .pill.busy { color: var(--accent); }
  .pill.dry { background: #fbe9c6; color: #7a5410; }
  .spacer { flex: 1; }
  .ghost { border: 1px solid var(--line); background: transparent; color: var(--ink); font: 13px var(--sans);
           padding: 6px 12px; border-radius: 10px; cursor: pointer; }
  .ghost:hover { background: var(--soft); }

  main { flex: 1; display: flex; min-height: 0; }
  .center { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #feed { flex: 1; overflow-y: auto; padding: 8px 16px 24px; }
  .col { max-width: 720px; margin: 0 auto; }

  /* empty state: greeting + prompt in the middle */
  body.empty #feed { display: none; }
  body.empty .composer-wrap { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .greeting { font-family: var(--serif); font-size: 34px; font-weight: 400; text-align: center; margin: 0 0 22px; }
  body:not(.empty) .greeting, body:not(.empty) .hints { display: none; }
  .hints { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }
  .hint { border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 999px;
          padding: 7px 13px; font: 13px var(--sans); cursor: pointer; }
  .hint:hover { color: var(--ink); background: var(--soft); }

  .composer-wrap { padding: 0 16px 20px; }
  .composer { background: var(--panel); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow);
              padding: 14px 14px 10px 18px; }
  .composer textarea { width: 100%; border: 0; outline: 0; resize: none; background: transparent; color: var(--ink);
                       font: 16px/1.45 var(--sans); min-height: 28px; max-height: 180px; }
  .composer textarea::placeholder { color: var(--muted); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .icon { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: transparent;
          color: var(--muted); display: grid; place-items: center; cursor: pointer; }
  .icon:hover { background: var(--soft); color: var(--ink); }
  .icon.rec { background: #fde6e4; color: var(--stop); border-color: #f3c1bc; animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(198,40,40,.12); } }
  .send { width: 36px; height: 36px; border-radius: 10px; border: 0; background: var(--accent); color: var(--accent-ink);
          display: grid; place-items: center; cursor: pointer; }
  .send:disabled { opacity: .35; cursor: default; }
  .voice-note { font-size: 12px; color: var(--muted); }

  /* feed */
  .msg-user { display: flex; justify-content: flex-end; margin: 18px 0 8px; }
  .msg-user div { background: var(--soft); padding: 10px 14px; border-radius: 16px; max-width: 80%; white-space: pre-wrap; }
  .msg-claude { margin: 10px 0; line-height: 1.55; white-space: pre-wrap; }
  .act { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line); background: var(--panel);
         border-radius: 14px; padding: 10px 12px; margin: 8px 0; }
  .act .st { width: 22px; height: 22px; flex: none; display: grid; place-items: center; margin-top: 1px; }
  .act .title { font-weight: 550; font-size: 14px; }
  .act .detail { color: var(--muted); font-size: 12.5px; margin-top: 3px; white-space: pre-wrap; word-break: break-word; }
  .act img { margin-top: 8px; max-width: 320px; width: 100%; border-radius: 10px; border: 1px solid var(--line); cursor: zoom-in; }
  .spin { width: 16px; height: 16px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%;
          animation: sp .8s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
  .thinking { color: var(--muted); font-size: 13px; margin: 8px 0; display: flex; align-items: center; gap: 8px; }
  .note { color: var(--muted); font-size: 13px; text-align: center; margin: 14px 0; }
  .note.bad { color: var(--bad); }

  /* camera drawer */
  #cam { width: 0; overflow: hidden; transition: width .2s; border-left: 1px solid transparent; }
  body.cam-open #cam { width: 360px; border-left-color: var(--line); }
  #cam .inner { width: 360px; padding: 14px; }
  #cam img { width: 100%; border-radius: 12px; border: 1px solid var(--line); background: var(--soft); min-height: 200px; }
  #cam .cap { font-size: 12px; color: var(--muted); margin: 8px 2px; }

  /* stop */
  #stop { position: fixed; right: 22px; bottom: 26px; border: 0; background: var(--stop); color: #fff;
          font: 700 15px var(--sans); letter-spacing: .5px; padding: 14px 22px; border-radius: 16px; cursor: pointer;
          box-shadow: 0 6px 20px rgba(198,40,40,.35); display: none; }
  body.busy #stop { display: block; }
  #stop:hover { filter: brightness(1.08); }

  /* setup panel */
  #setup { flex: 1; display: none; min-height: 0; overflow-y: auto; padding: 6px 18px 90px; }
  body.setup-open #setup { display: block; }
  body.setup-open .center { display: none; }
  .setup-grid { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(280px, 1fr); gap: 20px; align-items: start; }
  .setup-view { position: relative; }
  .setup-view img { width: 100%; border-radius: 14px; border: 1px solid var(--line); background: var(--soft); min-height: 240px; display: block; }
  .setup-view img:not([src]) { visibility: hidden; }
  .setup-view.clickable img { cursor: crosshair; outline: 3px solid var(--accent); outline-offset: -3px; }
  .setup-side { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 18px; }
  .setup-side h2 { font-family: var(--serif); font-weight: 400; font-size: 22px; margin: 0 0 4px; }
  .setup-side h3 { font-size: 15px; margin: 14px 0 6px; }
  .setup-side p { color: var(--muted); font-size: 14px; line-height: 1.5; margin: 0 0 12px; }
  .setup-side .flash { color: var(--ok); font-size: 13.5px; min-height: 18px; margin: 6px 0; }
  .setup-side .flash.bad { color: var(--bad); }
  .setup-side .warn { color: var(--bad); font-size: 13.5px; margin: 6px 0; }
  .setup-side .info { color: var(--muted); font-size: 12.5px; margin-top: 10px; }
  .setup-side input { width: 100%; padding: 9px 11px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: 14px var(--sans); margin-bottom: 10px; }
  .sbtns { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  .sbtn { border: 1px solid var(--line); background: transparent; color: var(--ink); font: 14px var(--sans); padding: 10px 12px; border-radius: 11px; cursor: pointer; text-align: left; }
  .sbtn:hover { background: var(--soft); }
  .sbtn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  .sbtn .k { float: right; opacity: .7; font-size: 12px; }
  .choice { display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 12px; padding: 12px 14px; margin: 8px 0; cursor: pointer; font: 14px var(--sans); }
  .choice:hover { background: var(--soft); }
  .choice b { display: block; font-size: 14.5px; margin-bottom: 3px; }
  .choice span { color: var(--muted); font-size: 13px; }
  @media (max-width: 760px) { .setup-grid { grid-template-columns: 1fr; } }

  #zoom { position: fixed; inset: 0; background: rgba(0,0,0,.7); display: none; place-items: center; z-index: 9; }
  #zoom img { max-width: 92vw; max-height: 92vh; border-radius: 12px; }
  @media (max-width: 760px) { body.cam-open #cam { width: 0; } .greeting { font-size: 27px; } }
</style>
</head>
<body class="empty">
<header>
  <span class="brand">reBot Arm</span>
  <span id="status" class="pill">Connecting…</span>
  <span id="dry" class="pill dry" hidden>Dry run</span>
  <span class="spacer"></span>
  <button class="ghost" id="setupBtn">Setup</button>
  <button class="ghost" id="camBtn">Camera</button>
  <button class="ghost" id="homeBtn">Home</button>
  <button class="ghost" id="newBtn">New chat</button>
  <button class="ghost" id="quitBtn">Quit</button>
</header>

<main>
  <div class="center">
    <div id="feed"><div class="col" id="items"></div></div>
    <div class="composer-wrap">
      <div class="col">
        <h1 class="greeting">What should the arm do?</h1>
        <div class="composer">
          <textarea id="input" rows="1" placeholder="e.g. Pick up the pink highlighter and put it in the box"></textarea>
          <div class="row">
            <button class="icon" id="mic" title="Speak your instruction">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
            </button>
            <span class="voice-note" id="voiceNote"></span>
            <span class="spacer"></span>
            <button class="send" id="send" title="Send (Enter)" disabled>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
            </button>
          </div>
        </div>
        <div class="hints">
          <button class="hint">Pick up the pink highlighter and put it in the box</button>
          <button class="hint">What highlighters do you see?</button>
          <button class="hint">Put every highlighter in the box</button>
        </div>
      </div>
    </div>
  </div>
  <section id="setup">
    <div class="setup-grid">
      <div class="setup-view" id="sview"><img id="setupImg" alt="Camera view"></div>
      <div class="setup-side" id="sside"></div>
    </div>
  </section>
  <aside id="cam"><div class="inner">
    <img id="camImg" alt="Live camera">
    <div class="cap">Live overhead camera</div>
  </div></aside>
</main>

<button id="stop">■ STOP</button>
<div id="zoom"><img alt=""></div>

<script>
const $ = (s) => document.querySelector(s);
const items = $("#items"), input = $("#input"), send = $("#send");
let last = 0, busy = false, actions = {}, thinkingEl = null;

function post(path, body) {
  return fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) })
    .then(r => r.json()).catch(() => ({}));
}
function scrollDown() { const f = $("#feed"); f.scrollTop = f.scrollHeight; }
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function clearThinking() { if (thinkingEl) { thinkingEl.remove(); thinkingEl = null; } }

const ICON = {
  done: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3f7d4f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>',
  error: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#b3261e" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  stopped: '<svg width="16" height="16" viewBox="0 0 24 24" fill="#c62828"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>',
};

function render(ev) {
  if (["user", "claude", "action", "stopped", "error"].includes(ev.kind)) document.body.classList.remove("empty");
  switch (ev.kind) {
    case "status": $("#status").textContent = ev.text; break;
    case "user": { const w = el("div", "msg-user"); w.appendChild(el("div", null, ev.text)); items.appendChild(w); break; }
    case "thinking": clearThinking(); thinkingEl = el("div", "thinking"); thinkingEl.innerHTML = '<span class="spin"></span>Planning…'; items.appendChild(thinkingEl); break;
    case "claude": clearThinking(); items.appendChild(el("div", "msg-claude", ev.text)); break;
    case "action": {
      clearThinking();
      const c = el("div", "act"); const st = el("div", "st"); st.innerHTML = '<span class="spin"></span>';
      const body = el("div"); body.appendChild(el("div", "title", ev.title)); const d = el("div", "detail", "In progress…"); body.appendChild(d);
      c.append(st, body); items.appendChild(c); actions[ev.id] = { st, body, d }; break;
    }
    case "action_done": {
      const a = actions[ev.action]; if (!a) break;
      a.st.innerHTML = ICON[ev.state] || ICON.done;
      a.d.textContent = ev.detail || (ev.state === "done" ? "Done" : "");
      if (!ev.detail && ev.state === "done") a.d.remove();
      if (ev.image) { const im = el("img"); im.src = "data:image/jpeg;base64," + ev.image; im.onclick = () => zoom(im.src); a.body.appendChild(im); }
      break;
    }
    case "stopped": clearThinking(); items.appendChild(el("div", "note bad", ev.text)); break;
    case "error": clearThinking(); items.appendChild(el("div", "note bad", ev.text)); break;
    case "cleared": items.innerHTML = ""; document.body.classList.add("empty"); break;
    case "idle": clearThinking(); break;
    case "setup_done": items.appendChild(el("div", "note", ev.text)); break;
  }
  scrollDown();
}

function setBusy(b) {
  busy = b; document.body.classList.toggle("busy", b);
  const s = $("#status"); s.classList.toggle("busy", b);
  const working = (typeof sState !== "undefined" && sState.mode) ? "Setup in progress" : "Working…";
  if (b) s.textContent = working;
  else if (["Working…", "Setup in progress", "Stop pressed"].includes(s.textContent) || s.textContent.startsWith("Setup:")) s.textContent = "Ready";
  updateSend();
}

async function poll() {
  try {
    const r = await fetch("/api/events?after=" + last).then(r => r.json());
    $("#dry").hidden = !r.dry_run;
    for (const ev of r.events) { last = ev.id; render(ev); }
    setBusy(r.busy);
  } catch (e) { $("#status").textContent = "Disconnected"; }
  setTimeout(poll, 350);
}

function updateSend() { send.disabled = busy || !input.value.trim(); }
function autosize() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 180) + "px"; updateSend(); }
async function submit() {
  const text = input.value.trim(); if (!text || busy) return;
  if (recog && listening) recog.stop();
  input.value = ""; autosize(); setBusy(true);
  const r = await post("/api/command", { text }); if (!r.ok) setBusy(false);
}
input.addEventListener("input", autosize);
input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); submit(); } });
send.onclick = submit;
document.querySelectorAll(".hint").forEach(h => h.onclick = () => { input.value = h.textContent; autosize(); input.focus(); });

$("#stop").onclick = () => post("/api/stop");
$("#homeBtn").onclick = () => { if (!busy) post("/api/home"); };
$("#newBtn").onclick = () => { if (!busy) post("/api/new"); };
$("#quitBtn").onclick = async () => {
  if (!confirm("Quit? The arm will drive itself home, then switch off.")) return;
  await post("/api/quit"); $("#status").textContent = "Arm going home…";
  setTimeout(() => { document.body.innerHTML = '<p class="note" style="margin-top:40vh">The arm is home and switched off. You can close this window.</p>'; }, 6000);
};
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && busy) post("/api/stop"); });

// camera drawer
let camTimer = null;
$("#camBtn").onclick = () => {
  document.body.classList.toggle("cam-open");
  if (document.body.classList.contains("cam-open")) {
    const tick = () => { $("#camImg").src = "/api/camera.jpg?t=" + Date.now(); camTimer = setTimeout(tick, 600); }; tick();
  } else clearTimeout(camTimer);
};

// ------------------------------------------------------------------ setup panel
const CHOICES = [
  ["camera", "Camera calibration", "Touch the 4 fiducial crosses with the gripper tip (leader arm), take a photo, click the crosses. ~5 min. Do this if the fiducials or the camera moved."],
  ["camera_photo", "Camera: new photo only", "The fiducials have not moved but the camera was bumped: just a new photo and 4 clicks. Arms are not used."],
  ["grabs", "Teach grabs", "Show the arm how to grab a highlighter at a new spot (leader arm). Use when picks miss in one area."],
  ["pose", "Save a pose", "Steer with the leader and save a named pose (e.g. drop_vertical over the box)."],
];
let sState = { mode: null }, sTimer = null, viewBusy = false, sFlashBad = "";
function setupOpen() { return document.body.classList.contains("setup-open"); }
$("#setupBtn").onclick = () => {
  if (setupOpen() && sState.mode) return;  // leave with Done/Cancel inside the panel
  document.body.classList.toggle("setup-open");
  $("#setupBtn").textContent = setupOpen() ? "Back to chat" : "Setup";
  if (setupOpen()) setupPoll(); else clearTimeout(sTimer);
};
async function setupPoll() {
  clearTimeout(sTimer);
  try { sState = await fetch("/api/setup").then(r => r.json()); renderSetup(); } catch (e) {}
  refreshView();
  if (setupOpen()) sTimer = setTimeout(setupPoll, 400);
}
function refreshView() {
  if (viewBusy) return;
  const img = $("#setupImg");
  if (!sState.mode) { img.removeAttribute("src"); return; }
  viewBusy = true;
  const nxt = new Image();
  nxt.onload = () => { img.src = nxt.src; viewBusy = false; };
  nxt.onerror = () => { viewBusy = false; };
  nxt.src = "/api/setup/view.jpg?t=" + Date.now();
}
let lastSig = "";
function renderSetup() {
  const side = $("#sside"), st = sState;
  $("#sview").classList.toggle("clickable", !!st.clickable);
  const sig = JSON.stringify([st.mode, st.step, st.heading, st.text, st.warn, st.flash, st.info, st.buttons, sFlashBad]);
  if (sig === lastSig) return; lastSig = sig;
  const nameVal = $("#poseName") ? $("#poseName").value : "";
  side.innerHTML = "";
  if (!st.mode) {
    side.appendChild(el("h2", null, "Setup"));
    side.appendChild(el("p", null, "Calibration and teaching. The arm only moves when you steer it with the leader arm, and goes home when you finish."));
    for (const [id, title, desc] of CHOICES) {
      const c = el("button", "choice"); c.appendChild(el("b", null, title)); c.appendChild(el("span", null, desc));
      c.onclick = async () => { sFlashBad = ""; const r = await post("/api/setup/start", { mode: id }); if (!r.ok) sFlashBad = r.error || "Could not start"; lastSig = ""; setupPoll(); };
      side.appendChild(c);
    }
    if (sFlashBad) side.appendChild(el("div", "flash bad", sFlashBad));
    return;
  }
  side.appendChild(el("h2", null, st.title));
  if (st.heading) side.appendChild(el("h3", null, st.heading));
  if (st.text) side.appendChild(el("p", null, st.text));
  if (st.warn) side.appendChild(el("div", "warn", st.warn));
  if (st.name_input) { const inp = el("input"); inp.id = "poseName"; inp.placeholder = "pose name, e.g. drop_vertical"; inp.value = nameVal; side.appendChild(inp); }
  const bw = el("div", "sbtns");
  for (const b of st.buttons) {
    const btn = el("button", "sbtn" + (b.primary ? " primary" : ""), b.label);
    if (b.primary) { const k = el("span", "k", "Space"); btn.appendChild(k); }
    btn.onclick = () => setupAct(b.id);
    bw.appendChild(btn);
  }
  side.appendChild(bw);
  side.appendChild(el("div", "flash" + (sFlashBad ? " bad" : ""), sFlashBad || st.flash || ""));
  if (st.info) side.appendChild(el("div", "info", st.info));
}
async function setupAct(action, extra) {
  const body = Object.assign({ action }, extra || {});
  if (action === "save" && sState.name_input) body.name = ($("#poseName") || {}).value || "";
  const r = await post("/api/setup/action", body);
  sFlashBad = r.ok ? "" : (r.error || "That didn't work");
  lastSig = ""; setupPoll();
}
$("#setupImg").addEventListener("click", (e) => {
  if (!sState.clickable) return;
  const img = e.currentTarget, rect = img.getBoundingClientRect();
  const x = (e.clientX - rect.left) / rect.width * img.naturalWidth, y = (e.clientY - rect.top) / rect.height * img.naturalHeight;
  setupAct("click", { x, y });
});
$("#setupImg").addEventListener("contextmenu", (e) => { if (sState.mode && sState.step === "click") { e.preventDefault(); setupAct("unclick"); } });
document.addEventListener("keydown", (e) => {
  if (!setupOpen() || !sState.mode || e.key !== " " || e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
  const p = (sState.buttons || []).find(b => b.primary); if (p) { e.preventDefault(); setupAct(p.id); }
});

function zoom(src) { $("#zoom img").src = src; $("#zoom").style.display = "grid"; }
$("#zoom").onclick = () => $("#zoom").style.display = "none";

// voice input (browser speech recognition)
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recog = null, listening = false, base = "";
if (!SR) { $("#mic").title = "Voice input isn't available in this browser"; $("#mic").style.opacity = .4; }
else {
  recog = new SR(); recog.lang = "en-US"; recog.interimResults = true; recog.continuous = false;
  recog.onstart = () => { listening = true; $("#mic").classList.add("rec"); $("#voiceNote").textContent = "Listening… speak your instruction"; };
  recog.onresult = (e) => {
    let text = ""; for (const r of e.results) text += r[0].transcript;
    input.value = (base ? base + " " : "") + text; autosize();
  };
  recog.onerror = (e) => { $("#voiceNote").textContent = e.error === "not-allowed" ? "Microphone access was blocked" : "Didn't catch that - try again"; };
  recog.onend = () => {
    listening = false; $("#mic").classList.remove("rec");
    if ($("#voiceNote").textContent.startsWith("Listening")) $("#voiceNote").textContent = input.value.trim() ? "Press Enter to send" : "";
    input.focus();
  };
}
$("#mic").onclick = () => {
  if (!recog) return;
  if (listening) { recog.stop(); return; }
  base = input.value.trim(); recog.start();
};

input.focus(); poll();
</script>
</body>
</html>
